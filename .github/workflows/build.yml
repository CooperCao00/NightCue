name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build solution and test
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $msbuild = & $vswhere -latest -products '*' -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) { throw 'MSBuild not found on runner.' }
          & $msbuild NightCue.sln /t:Rebuild /p:Configuration=Release /m /nologo
          if ($LASTEXITCODE -ne 0) { throw 'Solution build failed.' }
          & .\tests\NightCue.Tests\bin\Release\NightCue.Tests.exe
          if ($LASTEXITCODE -ne 0) { throw 'Solution tests failed.' }

      - name: Build with framework compiler, test and package
        run: .\scripts\package.ps1

      - name: Verify source archive can build independently
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $unpacked = Join-Path $env:RUNNER_TEMP 'NightCue source check 中文'
          Expand-Archive -LiteralPath "artifacts/packages/NightCue-source-v$version.zip" -DestinationPath $unpacked
          & (Join-Path $unpacked 'NightCue/build.ps1')

      - name: Upload release packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-packages
          path: |
            artifacts/packages/*.zip
            artifacts/packages/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
